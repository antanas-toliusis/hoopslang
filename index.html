<style>
/* Layout: arena scoreboard header, then a filterable index of term cards; each card ends in a YouTube search link */
:root {
  --bg: #f6f3ee;
  --surface: #ffffff;
  --ink: #1d1a17;
  --muted: #6b635b;
  --line: #e2dbd1;
  --leather: #d4581a;
  --leather-ink: #ffffff;
  --chip: #f1e7dc;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161412; --surface: #201d1a; --ink: #f2ece4; --muted: #a59b90;
    --line: #34302b; --leather: #ee7a3f; --leather-ink: #1a0f08; --chip: #2c2621;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161412; --surface: #201d1a; --ink: #f2ece4; --muted: #a59b90;
  --line: #34302b; --leather: #ee7a3f; --leather-ink: #1a0f08; --chip: #2c2621;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 24px; }
header { display: grid; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 {
  font-family: var(--display); font-weight: 900; text-transform: uppercase;
  font-size: clamp(44px, 11vw, 88px); line-height: .9; margin: 0; letter-spacing: .01em;
  text-wrap: balance;
}
h1 span { color: var(--leather); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.search-btn {
  flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--ink); background: var(--surface); color: var(--ink);
}
.search-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.search-btn:hover { background: var(--chip); }
.search-btn[aria-expanded="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search-btn:focus-visible, .search-bar input:focus-visible { outline: 3px solid var(--leather); outline-offset: 2px; }
.search-bar { margin: 6px 0 4px; position: relative; max-width: 560px; }
.suggest {
  position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px);
  margin: 0; padding: 6px; list-style: none;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px;
  box-shadow: 0 10px 28px rgb(0 0 0 / .18);
}
.suggest li {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer; font-weight: 600;
}
.suggest li small {
  flex-shrink: 0; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); background: var(--chip); padding: 2px 7px; border-radius: 5px;
}
.suggest li:hover, .suggest li[aria-selected="true"] { background: var(--chip); }
.suggest li[aria-selected="true"] small { background: var(--surface); }
.search-bar input {
  width: 100%; max-width: 560px; font: inherit; font-size: 17px; padding: 11px 16px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
.search-bar input::placeholder { color: var(--muted); }
.search-bar input { padding-right: 52px; }
.search-bar input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.q-clear {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--ink); color: var(--bg);
}
.q-clear svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.q-clear:hover { filter: brightness(1.25); }
.q-clear:focus-visible { outline: 3px solid var(--leather); outline-offset: 2px; }
mark { background: rgb(212 88 26 / .22); color: inherit; border-radius: 3px; padding: 0 1px; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

.controls { display: grid; gap: 12px; scroll-margin-top: 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filter {
  font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
}
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filter:focus-visible, .yt:focus-visible, .cat:focus-visible { outline: 3px solid var(--leather); outline-offset: 2px; }

.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.term {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.term-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.head-tools { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.fav {
  width: 36px; height: 36px; margin: -8px -8px -8px 0; display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer;
}
.fav svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.fav:hover { color: var(--ink); }
.fav[aria-pressed="true"] { color: var(--leather); }
.fav[aria-pressed="true"] svg { fill: currentColor; }
.fav:focus-visible { outline: 3px solid var(--leather); outline-offset: 0; }
.filter svg { width: 14px; height: 14px; fill: currentColor; vertical-align: -2px; margin-right: 5px; }
.term h2 {
  font-family: var(--display); font-weight: 700; text-transform: uppercase;
  font-size: 26px; line-height: 1; margin: 0; letter-spacing: .02em;
}
.cat {
  font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  background: var(--chip); color: var(--muted); padding: 3px 8px; border-radius: 5px; white-space: nowrap;
  border: 0; cursor: pointer; line-height: 1.5;
}
.cat:hover { color: var(--ink); }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.term p { margin: 0; color: var(--ink); flex: 1; }
.links { display: flex; gap: 8px; }
.yt {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 10px; text-decoration: none;
  background: #ff0000; color: #ffffff; /* YouTube brand red, same in both themes */
}
.yt.ig {
  background: #000000;
  color: #ffffff;
}
:root[data-theme="dark"] .yt.ig { box-shadow: inset 0 0 0 1px #3a3632; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .yt.ig { box-shadow: inset 0 0 0 1px #3a3632; }
}
.yt svg { width: 22px; height: 22px; fill: currentColor; }
.yt:hover { filter: brightness(1.08); }
.yt.ig:hover { filter: none; opacity: .85; }
.empty { color: var(--muted); padding: 24px 0; }
.links { gap: 18px; flex-wrap: wrap; }
.ext {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 0;
  font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none;
}
.ext:hover { text-decoration: underline; text-underline-offset: 3px; }
.ext:focus-visible { outline: 3px solid var(--leather); outline-offset: 2px; border-radius: 4px; }
.ext svg { width: 17px; height: 17px; flex-shrink: 0; }
.ext-yt svg { fill: #ff0000; }
.ext-ig svg { fill: none; stroke: currentColor; stroke-width: 2; }
.sections {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px;
  background: var(--chip); border-radius: 12px; max-width: 680px;
}
@media (max-width: 460px) { .sec { font-size: 16px; padding: 9px 2px; } }
.sec {
  font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 19px; letter-spacing: .03em;
  line-height: 1.05; padding: 9px 6px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer;
}
.sec:hover { color: var(--ink); }
.sec[aria-pressed="true"] { background: var(--leather); color: var(--leather-ink); box-shadow: 0 2px 6px rgb(212 88 26 / .35); }
.sec:focus-visible { outline: 3px solid var(--leather); outline-offset: 2px; }
.secnote { margin: 0; font-size: 14px; color: var(--muted); }
.term.flash { box-shadow: 0 0 0 3px var(--leather); }
@media (prefers-reduced-motion: no-preference) { .term { transition: box-shadow .4s; } }
.links { align-items: center; }
.drills-link, .book {
  margin-left: auto; font: inherit; font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap;
}
.drills-link { background: var(--leather); border-color: var(--leather); color: var(--leather-ink); font-weight: 700; letter-spacing: .02em; box-shadow: 0 2px 6px rgb(212 88 26 / .3); }
.drills-link:hover { filter: brightness(1.08); }
/* "Train this" as a bold underlined text link, so the row isn't two big buttons */
.drills-link, .book {
  background: none; border: 0; box-shadow: none; border-radius: 4px; padding: 8px 2px;
  color: var(--leather); font-weight: 700; font-size: 15px; letter-spacing: .01em;
  text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px;
}
.drills-link:hover, .book:hover { filter: none; text-decoration-thickness: 3px; }
.drills-link:focus-visible, .book:focus-visible, .skill-link:focus-visible, .clear-skill:focus-visible { outline: 3px solid var(--leather); outline-offset: 2px; }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -4px; }
.trains { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.trains span { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.skill-link {
  font: inherit; font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.skill-link:hover { border-color: var(--leather); color: var(--leather); }
.skill-link[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }
.drill .tip { flex: 0; margin: 0; font-size: 14px; background: var(--chip); border-radius: 8px; padding: 8px 10px; }
.drill .tip b { font-weight: 600; }
.drill .steps { flex: 1; }
.count b { color: var(--ink); font-weight: 600; }
.to-top {
  position: fixed; z-index: 10;
  right: max(16px, calc(env(safe-area-inset-right, 0px) + 12px));
  bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 16px));
  width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--leather); color: var(--leather-ink);
  box-shadow: 0 4px 14px rgb(0 0 0 / .25);
  opacity: 0; transform: translateY(12px); pointer-events: none;
}
.to-top.show { opacity: 1; transform: none; pointer-events: auto; }
@media (prefers-reduced-motion: no-preference) { .to-top { transition: opacity .2s, transform .2s; } }
.to-top svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.to-top:hover { filter: brightness(1.08); }
.to-top:focus-visible { outline: 3px solid var(--leather); outline-offset: 2px; }
/* Video: cards open a player */
.term { cursor: pointer; }
.term:hover { border-color: var(--muted); }
.play {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px;
  font: inherit; font-size: 14px; font-weight: 700; letter-spacing: .02em; cursor: pointer;
  border: 0; border-radius: 999px; background: var(--ink); color: var(--bg);
}
.play svg { width: 18px; height: 18px; fill: currentColor; }
.play:hover { filter: brightness(1.25); }
.play:focus-visible { outline: 3px solid var(--leather); outline-offset: 2px; }
.term .links { position: relative; flex-wrap: nowrap; }
.wm {
  position: absolute; z-index: 15; left: 0; bottom: calc(100% + 8px);
  display: grid; gap: 2px; padding: 6px; min-width: 240px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px;
  box-shadow: 0 10px 28px rgb(0 0 0 / .2);
}
.wm-item {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px;
  font: inherit; font-size: 15px; font-weight: 600; text-align: left; text-decoration: none;
  color: var(--ink); background: transparent; border: 0; cursor: pointer;
}
.wm-item:hover, .wm-item:focus-visible { background: var(--chip); outline: none; }
.wm-item small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.wm-item > svg, .wm-item > span:first-child { width: 28px; height: 28px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
.wm-item > svg { width: 26px; height: 26px; }
.wm-yt svg { width: 26px; height: 26px; fill: #ff0000; }
.wm-ig svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
.player {
  padding: 0; border: 0; background: transparent; color: var(--ink);
  max-width: calc(100vw - 32px); max-height: calc(100dvh - 32px);
}
.player::backdrop { background: rgb(10 8 6 / .78); }
.p-box {
  background: var(--surface); border-radius: 18px; padding: 14px; display: grid; gap: 12px;
  box-shadow: 0 20px 60px rgb(0 0 0 / .4);
}
.p-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.p-names { display: grid; gap: 2px; min-width: 0; }
.p-kind { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.p-head h2 {
  font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 26px; line-height: 1;
  margin: 0; letter-spacing: .02em; overflow-wrap: anywhere;
}
.p-close {
  flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; background: var(--chip); color: var(--ink);
}
.p-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.p-close:hover { background: var(--line); }
.p-close:focus-visible { outline: 3px solid var(--leather); outline-offset: 2px; }
.player video {
  display: block; background: #000; border-radius: 12px;
  /* vertical 9:16 clip: as tall as the screen allows, never wider than it */
  height: min(calc(100dvh - 140px), calc((100vw - 60px) * 16 / 9), 760px);
  aspect-ratio: 9 / 16; width: auto; max-width: 100%;
}
.clear-skill { font: inherit; font-size: 13px; color: var(--leather); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) {
  .yt { transition: filter .15s, background .15s; }
  .cat { transition: background .15s, color .15s; }
}
/* Coaching guide chapters: full-width cards */
.term.guide { grid-column: 1 / -1; gap: 12px; }
.term.guide { cursor: auto; }
.term.guide:hover { border-color: var(--line); }
.guide h2 { display: flex; align-items: baseline; gap: 10px; }
.gnum { color: var(--leather); font-size: 34px; line-height: .8; }
.gtag { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--chip); padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
.guide .glede { color: var(--muted); flex: 0; }
.guide h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.gcols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
@media (max-width: 640px) { .gcols { grid-template-columns: 1fr; } }
.gteach { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 15px; }
.gcues { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.gcue { background: var(--leather); color: var(--leather-ink); font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.guide .geye { flex: 0; margin: 0; font-size: 14px; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 10px 12px; }
.gfaults summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px 0; }
.gfaults summary:focus-visible { outline: 3px solid var(--leather); outline-offset: 2px; border-radius: 4px; }
.gtable { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
.gtable th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid var(--ink); }
.gtable td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.gtable td:first-child { font-weight: 600; }
.gscroll { overflow-x: auto; }
.gextra h3 { margin-top: 4px; }
.gextra .gtable + h3 { margin-top: 14px; }
.drill-jump { font: inherit; font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.drill-jump:hover { border-color: var(--leather); color: var(--leather); }
.drill-jump:focus-visible { outline: 3px solid var(--leather); outline-offset: 2px; }
</style>
</head>

<div class="wrap">
  <header>
    <div class="eyebrow">Basketball jargon, A to Z</div>
    <div class="brand">
      <h1>Hoops<span>lang</span></h1>
      <button type="button" class="search-btn" id="searchBtn" aria-label="Search" aria-expanded="false" aria-controls="searchBar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      </button>
    </div>
    <div class="search-bar" id="searchBar" hidden>
      <input type="search" id="q" placeholder="Search terms and drills" autocomplete="off" enterkeyhint="search" aria-label="Search terms and drills" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
      <button type="button" class="q-clear" id="qClear" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <ul class="suggest" id="suggest" role="listbox" aria-label="Suggestions" hidden></ul>
    </div>
    <p class="lede">Moves, plays and spots on the floor, explained in plain words, with drills to practise them and a coaching guide. Tap Watch to see each one in action on hoopslang, YouTube or Instagram. Tap the star to save a term to your Favourites.</p>
  </header>

  <div class="controls" id="controls">
    <div class="sections" id="sections" role="group" aria-label="Section"></div>
    <p class="secnote" id="secnote"></p>
    <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
    <div class="count" id="count"></div>
  </div>

  <button type="button" class="to-top" id="toTop" aria-label="Back to top" title="Back to top" inert>

<script>
const TERMS = [
  { term: "Killer crossover", cat: "Ball handling", def: "A hard, low dribble switched from one hand to the other at full speed, usually with a fake first, to shake the defender off balance." },
  { term: "Euro step", cat: "Ball handling", def: "Two steps in different directions on a drive: step one way, then sweep the other way past the defender before finishing." },
  { term: "Step-back", cat: "Ball handling", def: "A hop backwards off the dribble to create space for a jump shot." },
  { term: "Same-foot step-back", cat: "Ball handling", def: "A step-back where you push off one foot and land back on that same foot first, then bring the other foot down. Shorter and quicker than a normal step-back, it keeps your shoulders square and your balance set to rise straight into the shot." },
  { term: "Spin move", cat: "Ball handling", def: "A full turn while dribbling, keeping the body between defender and ball, to get past a defender who is leaning." },
  { term: "Half-spin", cat: "Ball handling", def: "Start a spin move, but stop halfway with your back to the defender, then pivot back the way you came. When the defender jumps to cut off the spin, you go back to the open side." },
  { term: "Hesitation", cat: "Ball handling", def: "A brief pause or fake stop mid-drive that freezes the defender, followed by an explosive burst." },
  { term: "Behind the back", cat: "Ball handling", def: "Switching hands by bouncing the ball behind the body, keeping it away from a reaching defender." },
  { term: "Between the legs", cat: "Ball handling", def: "Switching hands by bouncing the ball through your legs, keeping your body between the defender and the ball." },
  { term: "In and out", cat: "Ball handling", def: "Fake a crossover by pushing the ball inward, then pull it back out with the same hand and go." },
  { term: "Shamgod", cat: "Ball handling", def: "Push the ball out wide with one hand, then pull it back across with the other as you step past the defender." },
  { term: "Snatch back", cat: "Ball handling", def: "Yank the ball back toward you while hopping backwards, to create space or reset the play." },
  { term: "Jab step", cat: "Ball handling", def: "A quick, short step at the defender from triple threat to make them react, while keeping your pivot foot planted." },
  { term: "Triple threat", cat: "Ball handling", def: "Holding the ball at the hip with knees bent, ready to shoot, pass or dribble." },
  { term: "Rocker step", cat: "Ball handling", def: "A jab step, then rock back as if to shoot, then drive past the defender when they close in." },
  { term: "First step", cat: "Ball handling", def: "The explosive first stride past your defender from triple threat or a standstill. A quick first step wins the drive before the defender can react." },
  { term: "Direct drive", cat: "Ball handling", def: "A first step straight past the defender's lead foot, on the same side as the ball. Also called an open step." },
  { term: "Downhill", cat: "Ball handling", def: "Attacking the basket in a straight line at full speed, with your shoulders and momentum going toward the rim. Also called attacking downhill or getting downhill. It puts the defender on their heels." },
  { term: "Baseline drive", cat: "Ball handling", def: "Driving past your defender on the baseline side, along the end line toward the rim. Often finished with a reverse layup or a pass out to the corner." },
  { term: "Crossover step", cat: "Ball handling", def: "A first step that crosses over your body to the other side, swinging the ball through low to protect it from the defender. Also called a cross step." },
  { term: "Retreat dribble", cat: "Ball handling", def: "Dribbling backwards away from pressure to buy space and see the floor." },
  { term: "Pound dribble", cat: "Ball handling", def: "A hard, forceful dribble that keeps the ball under control and builds rhythm." },
  { term: "Change of pace", cat: "Ball handling", def: "Going slow, then exploding fast, or the reverse, to throw off the defender's timing." },
  { term: "Overload training", cat: "Ball handling", def: "Making practice harder than the game, with two balls, a tennis ball, reaction calls or less time, so one ball in a game feels easy." },
  { term: "Two-foot stop", cat: "Ball handling", def: "At full speed, plant both feet at the same time and stop. Either foot can be your pivot, so you can shoot, fake or pivot. Also called a jump stop." },
  { term: "Stop and go", cat: "Ball handling", def: "Drive hard, stop suddenly to freeze the defender, then explode again past them." },
  { term: "Jumper", cat: "Shooting", def: "A shot taken while jumping straight up, released at the top of the jump. Also called a jump shot." },
  { term: "Pull-up jumper", cat: "Shooting", def: "Stop suddenly off the dribble and rise straight into a jump shot." },
  { term: "Catch and shoot", cat: "Shooting", def: "Receive a pass already in shooting position and shoot right away, with no dribble." },
  { term: "Shot off a screen", cat: "Shooting", def: "Run your defender into a teammate's screen, catch on the move and shoot before the defense recovers." },
  { term: "Fadeaway", cat: "Shooting", def: "A jump shot taken while leaning or jumping backwards, away from the defender, to make it hard to block." },
  { term: "Turnaround jumper", cat: "Shooting", def: "With your back to the basket, pivot or spin to face it and rise into a jump shot." },
  { term: "Side-step three", cat: "Shooting", def: "A hop sideways off the dribble to get clear of a closing defender, then a three-point shot." },
  { term: "Hop into shot", cat: "Shooting", def: "Land on both feet at once from a small hop before shooting, so you can square up and pivot either way." },
  { term: "One-two step", cat: "Shooting", def: "Plant one foot then the other going into a shot, inside foot first, then outside foot, using the steps to gather rhythm and balance. Also called a one-two stop." },
  { term: "Pump fake", cat: "Shooting", def: "Fake a shot by lifting the ball without leaving the floor, to get the defender to jump." },
  { term: "Mid-range", cat: "Shooting", def: "A jump shot from inside the three-point line but outside the paint." },
  { term: "Three-pointer", cat: "Shooting", def: "A shot from behind the three-point line, worth three points." },
  { term: "Deep three", cat: "Shooting", def: "A three-pointer taken well behind the line, often several feet back." },
  { term: "Bank shot", cat: "Shooting", def: "A shot aimed off the backboard into the basket, most useful from angles on the side." },
  { term: "Free throw", cat: "Shooting", def: "An unguarded shot from the free-throw line after a foul, worth one point." },
  { term: "Set shot", cat: "Shooting", def: "A shot taken with your feet staying on or barely leaving the floor, as with a free throw." },
  { term: "Shot pocket", cat: "Shooting", def: "The spot near your hip or chest where you hold the ball just before you shoot. Catching straight into it makes your shot quicker." },
  { term: "Follow-through", cat: "Shooting", def: "Finishing the shot with your arm extended and wrist snapped down, held until the ball lands. Also called gooseneck." },
  { term: "Arc", cat: "Shooting", def: "How high the ball travels on its way to the rim. More arc gives the ball a bigger target as it drops in." },
  { term: "Shooting line", cat: "Shooting", def: "An imaginary straight line from the rim down to your shooting foot. Foot, knee, hip, elbow, wrist and ball all stay on it, which keeps the shot from missing left or right." },
  { term: "Face-up jumper", cat: "Shooting", def: "Catching with your back to the basket or on the move, turning to face the rim, reading the defender, then rising into a jump shot." },
  { term: "Floater", cat: "Finishing", def: "A soft, high-arcing one-handed shot released early over taller defenders near the basket." },
  { term: "Layup", cat: "Finishing", def: "A one-handed shot taken right next to the basket, usually laid softly off the backboard." },
  { term: "Reverse layup", cat: "Finishing", def: "A layup finished on the far side of the basket, using the rim to shield the ball from the defender." },
  { term: "Finger roll", cat: "Finishing", def: "A layup where the ball rolls off the fingertips with the palm facing up." },
  { term: "Scoop layup", cat: "Finishing", def: "An underhand layup scooped up low and early, under a shot blocker's arms." },
  { term: "Runner", cat: "Finishing", def: "A one-handed shot thrown up on the move from a few steps out, without stopping. A faster, flatter floater." },
  { term: "Hook shot", cat: "Finishing", def: "A one-handed shot swept up and over the head, with the body sideways to shield the ball." },
  { term: "Up and under", cat: "Finishing", def: "A complete scoring move: a convincing shot fake to get the defender in the air, then a step-through under them for the finish." },
  { term: "Step-through", cat: "Ball handling", def: "Footwork, not a full move: keep your pivot foot down and step the other foot past your defender. No shot fake needed, and you can finish or pass out of it. It's the second half of an up and under." },
  { term: "Speed dribble", cat: "Ball handling", def: "Pushing the ball out ahead of you at waist height so you can sprint at full speed, used in the open court." },
  { term: "Control dribble", cat: "Ball handling", def: "A low, tight dribble kept beside your body, with your off arm up to shield it, used when a defender is close." },
  { term: "Double crossover", cat: "Ball handling", def: "Two crossovers in a row: cross one way, then straight back the other way before the defender can recover." },
  { term: "Pullback crossover", cat: "Ball handling", def: "Drive hard, then pull the ball back with one or two quick backward steps while keeping your dribble. When the defender steps up to follow, cross over and attack the other side. Great for escaping a trap or a defender who is cutting off your drive." },
  { term: "Hang dribble", cat: "Ball handling", def: "Holding the ball at the top of the bounce for a split second, as if about to shoot or pass, to freeze the defender before you attack." },
  { term: "Front pivot", cat: "Ball handling", def: "Keeping one foot planted and stepping forward with the other to turn, so you face where you were going." },
  { term: "Reverse pivot", cat: "Ball handling", def: "Keeping one foot planted and swinging the other foot backwards to turn, often to escape pressure or face the basket." },
  { term: "Sweep through", cat: "Ball handling", def: "From triple threat, swinging the ball low and hard across your body, below the defender's hands, to protect it and set up a drive." },
  { term: "Dunk", cat: "Finishing", def: "Jumping up and putting the ball straight down through the rim." },
  { term: "Putback", cat: "Finishing", def: "Grabbing an offensive rebound and scoring straight away, close to the rim." },
  { term: "And-one", cat: "Finishing", def: "Scoring while being fouled. The basket counts and you get one free throw." },
  { term: "Pick and roll", cat: "Team offense", def: "A teammate sets a screen for the ball handler, then rolls toward the basket for a pass." },
  { term: "Give and go", cat: "Team offense", def: "Pass to a teammate, cut hard to the basket, and get the ball right back." },
  { term: "Fast break", cat: "Team offense", def: "Pushing the ball up the floor quickly to score before the defense is set." },
  { term: "Pick and pop", cat: "Team offense", def: "The screener steps out for a jump shot instead of rolling to the basket." },
  { term: "Isolation", cat: "Team offense", def: "Clearing out one side so one player can go one-on-one. Often called iso." },
  { term: "Post up", cat: "Off-ball", def: "Setting up near the basket with your back to the defender, calling for the ball." },
  { term: "Drive and kick", cat: "Team offense", def: "Attack the basket to pull defenders in, then pass out to an open shooter." },
  { term: "Dribble handoff", cat: "Team offense", def: "The ball handler dribbles toward a teammate and hands them the ball while screening their defender." },
  { term: "Alley-oop", cat: "Team offense", def: "A lob pass caught in the air near the rim and finished with a dunk or layup before landing." },
  { term: "Motion offense", cat: "Team offense", def: "An offense built on constant passing, cutting and screening instead of fixed set plays." },
  { term: "Inbound play", cat: "Team offense", def: "A set play to get the ball in from out of bounds, from under the basket or the sideline." },
  { term: "Offensive rebound", cat: "Finishing", def: "Grabbing a missed shot on your own team's end for another chance to score." },
  { term: "Power layup", cat: "Finishing", def: "A layup off two feet, with the ball held in both hands and the shoulder leading into contact." },
  { term: "Pro hop", cat: "Finishing", def: "A hop off one foot that lands on both feet at the same time going into a layup, so you can finish strong on either side." },
  { term: "Wrong-foot layup", cat: "Finishing", def: "A layup taken off the 'wrong' foot (the same side as the shooting hand), which changes your timing and catches shot blockers off guard." },
  { term: "Inside-hand layup", cat: "Finishing", def: "Finishing with the hand nearest the middle of the court, used to get the ball around a defender coming across." },
  { term: "Drop step", cat: "Finishing", def: "In the post, swinging one foot back around the defender and sealing them behind you, then going strong to the rim." },
  { term: "Dream shake", cat: "Finishing", def: "A post move built from fakes and pivots: fake one way, spin or step the other, then finish once the defender bites." },
  { term: "Baby hook", cat: "Finishing", def: "A short hook shot from close range, released with one hand over the defender, with your body between them and the ball." },
  { term: "Spacing", cat: "Team offense", def: "Spreading players out across the floor so defenders can't easily help each other." },
  { term: "Horns", cat: "Team offense", def: "A half-court set with two players at the elbows, one in each corner, and the ball handler at the top." },
  { term: "Floppy", cat: "Team offense", def: "A set where a shooter starts under the basket and picks to run off one of two screens on either side to get open." },
  { term: "Slip", cat: "Team offense", def: "When a screener cuts to the rim before making contact, catching the defense switching or hedging too early." },
  { term: "Ghost screen", cat: "Team offense", def: "A screen faked by running toward the ball handler and then away without setting it, to confuse the defenders." },
  { term: "Dive", cat: "Team offense", def: "After setting a screen, the screener sprints straight to the rim, without pivoting open to the ball as in a classic roll. Coaches often call it 'set and dive'." },
  { term: "Elevator screen", cat: "Team offense", def: "Two screeners stand side by side, then close together like elevator doors after a shooter runs through the gap." },
  { term: "Transition", cat: "Team offense", def: "The moments after a change of possession, when one team pushes the ball up before the defense is set." },
  { term: "Transition vs fast break", cat: "Team offense", def: "Every fast break is transition, but not every transition is a fast break. The fast break is the quickest, most aggressive form of transition." },
  { term: "Wave", cat: "Team offense", def: "A ball-screen offense that never stops. A big sprints out to set a side ball screen, and when the ball swings to the other side, the next screen comes straight away, wave after wave." },
  { term: "Weave", cat: "Team offense", def: "Three or more players dribble toward each other and hand the ball off in a moving line across the top, until a defender slips and someone drives." },
  { term: "Princeton offense", cat: "Team offense", def: "A patient offense of constant passing, cutting and backdoor cuts, often run with a big at the high post. Made famous by Princeton University." },
  { term: "Flex offense", cat: "Team offense", def: "A repeating pattern of baseline cross screens and down screens. Every player cuts and screens, so it fits teams without one star." },
  { term: "Shuffle offense", cat: "Team offense", def: "An old continuity offense where players run a set path of cuts, mainly off a high-post screen, so all five rotate through every spot." },
  { term: "Triangle offense", cat: "Team offense", def: "A read-based offense that forms a triangle on one side (post, wing and corner) with two-man play on the other. Also called the triple-post offense." },
  { term: "Dribble drive motion", cat: "Team offense", def: "Four players spread out and the ball handler attacks the rim. Teammates move to set spots as the drive happens, ready for a kick-out or a dump-off." },
  { term: "Wheel offense", cat: "Team offense", def: "A continuity offense that rotates players around the floor with a cutter, a screen and a ball reversal, like a turning wheel." },
  { term: "Swing offense", cat: "Team offense", def: "A motion offense where post players move out to set screens on the perimeter and the ball swings side to side. Also called the Wisconsin swing." },
  { term: "Read and react", cat: "Team offense", def: "An offense with no set plays. Players learn rules (if the defender does this, you do that) and react to what the ball handler does." },
  { term: "Pace and space", cat: "Team offense", def: "A style of play that pushes the tempo and keeps four or five shooters spread out, to create open threes and driving lanes." },
  { term: "5-out", cat: "Team offense", def: "A formation with all five players outside the three-point line, which leaves the paint open for drives and cuts." },
  { term: "4-out 1-in", cat: "Team offense", def: "A formation with four players on the perimeter and one big in the post." },
  { term: "1-4 high", cat: "Team offense", def: "A set with the ball handler at the top and four players in a line across the free-throw line extended: two bigs at the elbows and two wings." },
  { term: "Stack", cat: "Team offense", def: "Two or more players lined up close together, one behind the other. They split apart to screen or pop out, which makes them hard to guard." },
  { term: "Box set", cat: "Team offense", def: "Four players form a square: two at the elbows and two on the blocks. Often used for inbound plays." },
  { term: "Spain pick and roll", cat: "Team offense", def: "A pick and roll where a third player sets a back screen on the roller's defender just as the screen happens, then pops out for a three. Also called stack pick and roll." },
  { term: "Chicago action", cat: "Team offense", def: "A shooter comes off a pin-down screen and straight into a dribble handoff, so the defender has to fight through two screens in a row." },
  { term: "Hammer", cat: "Team offense", def: "A drive toward the baseline while a teammate sets a screen on the weak side for a shooter, who drifts to the corner for a kick-out three." },
  { term: "Pistol", cat: "Team offense", def: "Early offense on the wing: the guard passes ahead to the wing and follows for a handoff or a quick ball screen. Also called 21 action." },
  { term: "Drag screen", cat: "Team offense", def: "A ball screen set by a trailing big in transition, before the defense is set." },
  { term: "Double drag", cat: "Team offense", def: "Two trailers in transition set ball screens one after the other for the ball handler. One then rolls and the other pops." },
  { term: "Empty corner", cat: "Team offense", def: "A pick and roll run toward a side with nobody in the corner, so no defender is close enough to help." },
  { term: "Pinch post", cat: "Team offense", def: "The ball goes to a big at the elbow, and the guard who passed it runs off them for a handoff or a backdoor cut." },
  { term: "Blind pig", cat: "Team offense", def: "When a wing is denied, a post flashes to the high post for the pass, and the wing cuts backdoor for a bounce pass." },
  { term: "High-low", cat: "Team offense", def: "Two bigs work together: one at the high post passes down to the other sealing near the basket." },
  { term: "Split action", cat: "Team offense", def: "After passing into the post, two perimeter players screen for each other, so one gets open for a shot or a cut." },
  { term: "Delay", cat: "Team offense", def: "A big at the top of the key handles the ball while the guards set up backdoor cuts and handoffs around them." },
  { term: "Overload", cat: "Team offense", def: "An attack on a zone by putting more offensive players on one side than the zone has defenders there." },
  { term: "Ball reversal", cat: "Team offense", def: "Moving the ball from one side of the floor to the other with quick passes, to make the defense shift and open gaps." },
  { term: "Secondary break", cat: "Team offense", def: "The set pattern a team runs straight after a fast break, while the defense is still matching up, before going into its half-court offense." },
  { term: "ATO", cat: "Team offense", def: "Short for after timeout: a set play a coach draws up in a timeout, often for a key possession." },
  { term: "BLOB", cat: "Team offense", def: "Short for baseline out of bounds: an inbound play from under your own basket." },
  { term: "SLOB", cat: "Team offense", def: "Short for sideline out of bounds: an inbound play from the side of the court." },
  { term: "Backdoor cut", cat: "Off-ball", def: "A cut behind an overplaying defender toward the basket, away from the ball." },
  { term: "V-cut", cat: "Off-ball", def: "Walk your defender toward the basket, then plant and burst back out to the wing to get open." },
  { term: "L-cut", cat: "Off-ball", def: "Go up the lane, then cut sharply out toward the wing in an L shape." },
  { term: "Curl", cat: "Off-ball", def: "Come off a screen and wrap tightly around it toward the basket." },
  { term: "Flare", cat: "Off-ball", def: "Drift away from the ball off a screen to get open for a jump shot." },
  { term: "Flash", cat: "Off-ball", def: "A quick cut into open space, usually the high post or the paint, to receive the ball." },
  { term: "Shake", cat: "Off-ball", def: "Lift or slide along the three-point line to stay in the passer's line of sight when your defender helps." },
  { term: "Relocate", cat: "Off-ball", def: "After passing, move to a new open spot instead of standing still." },
  { term: "Seal", cat: "Off-ball", def: "Pin your defender behind you with your body so you're open for an entry pass." },
  { term: "Off-ball screen", cat: "Off-ball", def: "Setting a pick for a teammate who doesn't have the ball." },
  { term: "Spot up", cat: "Off-ball", def: "Set your feet in an open spot, ready to catch and shoot." },
  { term: "Basket cut", cat: "Off-ball", def: "A hard cut straight to the rim from the perimeter, looking for a pass and a layup." },
  { term: "Shallow cut", cat: "Off-ball", def: "A cut up toward the ball handler and then out to the perimeter, to clear space or receive a handoff." },
  { term: "Duck in", cat: "Off-ball", def: "Stepping into the paint in front of your defender when the ball is on the wing, getting deep post position." },
  { term: "Lift", cat: "Off-ball", def: "Moving up from the corner to the wing when the ball is driven toward you, to give the driver a passing target." },
  { term: "Pin-down", cat: "Off-ball", def: "A screen set facing the baseline, so a player near the basket can run up and out for a catch. Also called a down screen." },
  { term: "Back screen", cat: "Off-ball", def: "A screen set behind a defender, so the cutter can run toward the basket while the defender can't see it coming." },
  { term: "Cross screen", cat: "Off-ball", def: "A screen set across the lane, usually from one block to the other, to free a post player." },
  { term: "Stagger screen", cat: "Off-ball", def: "Two screens in a row, one after the other, for the same player." },
  { term: "Screen the screener", cat: "Off-ball", def: "A player sets a screen, then gets a screen straight away for themselves, so the defense has two actions in a row to deal with." },
  { term: "Ram screen", cat: "Off-ball", def: "A screen set on the big who is about to set a ball screen, so their defender can't step up and help." },
  { term: "Step-up screen", cat: "Off-ball", def: "A ball screen where the big comes up from the baseline side, instead of from the middle of the floor." },
  { term: "Zipper", cat: "Off-ball", def: "A guard runs straight up the lane line off a down screen to catch the ball at the top. A common way to start a set." },
  { term: "Iverson cut", cat: "Off-ball", def: "A wing runs across the floor over two screens set by the bigs at the elbows, catching on the other wing. Named after Allen Iverson." },
  { term: "UCLA cut", cat: "Off-ball", def: "After passing to the wing, the guard cuts to the basket off a back screen from the high post." },
  { term: "Flex cut", cat: "Off-ball", def: "A cut from the corner along the baseline, off a screen, toward the block on the ball side." },
  { term: "Shuffle cut", cat: "Off-ball", def: "A cut from the wing off a screen at the high post toward the basket." },
  { term: "Chest pass", cat: "Passing", def: "A two-handed pass pushed straight from your chest to a teammate's chest." },
  { term: "Bounce pass", cat: "Passing", def: "A pass bounced off the floor about two-thirds of the way to the receiver." },
  { term: "Overhead pass", cat: "Passing", def: "A two-handed pass thrown from above the head, to get over a defender or start a break." },
  { term: "Skip pass", cat: "Passing", def: "A pass across the court that skips the nearest teammate and goes to the far side." },
  { term: "Entry pass", cat: "Passing", def: "A pass into a teammate posting up near the basket." },
  { term: "Outlet pass", cat: "Passing", def: "The first pass after a defensive rebound, usually to a guard near the sideline, to start the break." },
  { term: "No-look pass", cat: "Passing", def: "A pass made while looking somewhere else, to fool the defense." },
  { term: "Lob", cat: "Passing", def: "A high, arcing pass thrown over the defense." },
  { term: "Wraparound pass", cat: "Passing", def: "A pass whipped around a defender's body, usually on a drive." },
  { term: "Assist", cat: "Passing", def: "The pass that leads directly to a teammate's basket." },
  { term: "Pocket pass", cat: "Passing", def: "A quick bounce pass between defenders, often to the screener rolling to the rim in a pick and roll." },
  { term: "Baseball pass", cat: "Passing", def: "A long one-handed pass thrown from behind the ear, like throwing a baseball, to reach a teammate far down the court." },
  { term: "Behind-the-back pass", cat: "Passing", def: "Passing by swinging the ball around your back with one hand, to get it past a defender who is in the passing lane." },
  { term: "Touch pass", cat: "Passing", def: "Passing the ball on straight away as it arrives, without catching and holding it, to move it faster than the defense." },
  { term: "Lead pass", cat: "Passing", def: "A pass thrown ahead of a moving teammate so they catch it in stride, without slowing down." },
  { term: "Box out", cat: "Defense skills", def: "Using your body to seal an opponent away from the basket so you get the rebound." },
  { term: "Help defense", cat: "Team defense", def: "Leaving your own player for a moment to stop a teammate's beaten defender." },
  { term: "Zone defense", cat: "Team defense", def: "Each defender guards an area of the floor instead of one player." },
  { term: "Full-court press", cat: "Team defense", def: "Pressuring the ball handler from the moment the ball is inbounded, all the way up the court." },
  { term: "Man-to-man", cat: "Team defense", def: "Each defender guards one opposing player wherever they go." },
  { term: "Defensive stance", cat: "Defense skills", def: "Feet wide, knees bent, back straight and hands active, ready to slide." },
  { term: "Closeout", cat: "Defense skills", def: "Sprint out to a shooter, then chop your steps to arrive under control with a hand up." },

// Opens the YouTube app on phones via universal link; falls back to the browser.
// One tag per term, shared by YouTube and Instagram: "Pick and roll" -> "pickandrollbasketball".
// Use this exact tag on your own shorts so they land on these pages.
const TAG_POSTFIX = "basketball";
const tagBase = term => term.toLowerCase().replace(/[^a-z0-9]/g, "");
const tagFor = term => tagBase(term) + TAG_POSTFIX;

// YouTube: search the hoopslang channel (@hoopslangcom) for the term, e.g. "Pick and roll".
const YT_CHANNEL = "https://www.youtube.com/@hoopslangcom";
const ytQuery = term => term;
const ytSearch = term =>
  YT_CHANNEL + "/search?query=" + encodeURIComponent(ytQuery(term));

// Instagram has no public search URL, so link to the term's hashtag page (also opens the app).

  { name: "Lunge and between-the-legs drive", level: "Intermediate", time: "5 min", gear: "Hoop, cone",

// Coaching guide: one chapter per card. Teach-it items starting with "Label:" get a bold label.

const GUIDE = [
  { n: 1, title: "Shooting foundations", group: "Shooting",
    lede: "Every shot is built on the same base: balanced feet, a straight line from foot to ball to rim, and the same release every time. Teach this first and protect it in every drill.",
    teach: ["Base: feet about shoulder-width, shooting foot slightly ahead, toes turned a little toward the rim.", "Bend: knees bend before the catch, not after. The legs give the power.", "Shot pocket: the ball starts in the same place every time.", "Hand: ball on the finger pads, guide hand on the side, not pushing.", "Elbow: under the ball and in line with the rim.", "Release: extend up and snap the wrist. Index and middle fingers last.", "Follow-through: hold it until the ball lands.", "Land: on the spot you took off from. Drifting means the base was off."],
    cues: ["Feet set", "Elbow under", "Up, not out", "Hold it", "Land soft"],
    faults: [["Misses left or right", "Elbow or guide hand off the shooting line", "Shoot one-handed close in. Check the guide hand comes off cleanly."], ["Flat shot, front rim", "Pushing the ball forward, little leg bend", "Cue “up, not out”. Shoot over a raised hand."], ["Short when tired", "Legs stop working", "More bend before the catch. Stop before fatigue sets in."], ["Fading or drifting", "Narrow base or weight on heels", "Land on a tape mark. Widen the feet slightly."]],
    eye: "Watch the guide hand and the landing. If both are clean, most of the rest usually is too.",
    drills: ["Form shooting", "One-hand ladder", "Arc check"] },
  { n: 2, title: "Form shooting", group: "Shooting",
    lede: "Form shooting builds the release close to the rim, where the player makes lots of shots and feels success. Distance comes later. Use it as the daily warm-up.",
    teach: ["Start one step from the rim, straight on, one hand only.", "Make 5 in a row before stepping back. A miss resets the count.", "Add the guide hand around the free-throw line.", "Move to the angles only when straight-on is clean.", "Finish with a few free throws while the feel is fresh."],
    cues: ["Same pocket", "Wrist snap", "Swish"],
    faults: [["Lots of misses", "Too far out too soon", "Move closer until the make rate is high."], ["Ball hits the back rim", "Too much push, not enough arc", "Shoot over a raised hand or broom."]],
    eye: "Count makes, not shots. A player who makes 50 of 60 is building confidence. One who makes 20 of 60 is practising missing.",
    drills: ["One-hand ladder", "Arc check", "Bank shot box", "Form shooting", "Elbow and block shooting"] },
  { n: 3, title: "Shooting off the catch", group: "Shooting",
    lede: "Most shots in a game come off a pass. The shooter who is ready before the ball arrives gets the shot off before the closeout.",
    teach: ["Show hands: both hands up as a target, fingers spread, chest height.", "Sit early: knees already bent before the catch.", "Hop: both feet land together. Either foot can pivot, slightly slower.", "One-two: inside foot, then outside foot. Fast, with rhythm.", "Catch into the pocket: straight to the shot pocket, never down to the waist.", "Square up: feet and shoulders face the rim before the rise."],
    cues: ["Hands ready", "Sit before the catch", "Inside foot", "Catch and go"],
    faults: [["Slow release", "Catching upright, then dipping", "Sit before the catch. Catch at chest height and go up."], ["Off-balance shots", "Feet not set before the catch", "Freeze on the catch for a count of one, then shoot."], ["Fumbled catches", "Hands not ready", "Hands up early. Partner throws slightly off target on purpose."]],

// Four sections: what one player can practise, the team side of the game, drills, and the coaching guide.
const SECTIONS = [
  { id: "skills", name: "Skills", note: "Moves and skills one player can practise.",
    cats: ["Ball handling", "Shooting", "Finishing", "Passing", "Off-ball", "Defense skills"] },
  { id: "game", name: "The game", note: "Team plays and defenses, the court, the rules and the talk.",
    cats: ["Team offense", "Team defense", "Court areas", "Rules", "Slang"] },
  { id: "drills", name: "Training", note: "Short drills, mostly on your own. A ball and a hoop are enough, sometimes a few cones or a partner.",
    cats: LEVELS },
  { id: "coach", name: "Coaching", note: "A coach's guide to shooting, ball-handling and scoring: what to teach, what to say, what to fix, and which drills to use.",
    cats: GROUPS }
];
const secOf = cat => (SECTIONS.find(s => s.cats.includes(cat)) || SECTIONS[0]).id;
const drillsFor = term => DRILLS.filter(d => d.skills.includes(term));
let activeSec = "skills";
let activeCat = "All";
let activeSkill = null; // set when coming from a skill card's "drills" button

const grid = document.getElementById("grid");
const count = document.getElementById("count");
const filters = document.getElementById("filters");
const controls = document.getElementById("controls");
const sectionsEl = document.getElementById("sections");
const secnote = document.getElementById("secnote");

function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Rebuilds the chips for the active section. Terms: All, Favourites, categories. Drills: All and levels.
function buildFilters() {
  const sec = SECTIONS.find(x => x.id === activeSec);
  sectionsEl.querySelectorAll(".sec").forEach(x => x.setAttribute("aria-pressed", x.dataset.sec === activeSec));
  secnote.textContent = sec.note;
  filters.innerHTML = "";
  const chips = activeSec === "drills" || activeSec === "coach" ? ["All", ...sec.cats] : ["All", "Favourites", ...sec.cats];
  chips.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "filter";
    b.id = "f-" + c.toLowerCase().replace(/\s+/g, "-");
    b.dataset.cat = c;
    if (c === "Favourites") b.innerHTML = STAR + 'Favourites · <span id="favn">' + favCount() + '</span>';
    else b.textContent = c;
    b.setAttribute("aria-pressed", c === activeCat);
    b.addEventListener("click", () => setCat(c));
    filters.appendChild(b);
  });
}

function setCat(c) {
  clearSearch();
  activeCat = c;
  activeSkill = null;
  filters.querySelectorAll(".filter").forEach(x => x.setAttribute("aria-pressed", x.dataset.cat === c));
  render();
}

function setSec(id) {
  clearSearch();
  activeSec = id;
  activeCat = "All";
  activeSkill = null;
  buildFilters();
  render();
}

SECTIONS.forEach(x => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "sec";
  b.id = "s-" + x.id;
  b.dataset.sec = x.id;
  b.textContent = x.name;
  b.addEventListener("click", () => setSec(x.id));
  sectionsEl.appendChild(b);
});
buildFilters();

function scrollToControls() {
  const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (controls.getBoundingClientRect().top < 0) controls.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
}

// Jump from a drill to one of the skills it trains, and highlight that card.
function showTerm(name) {
  const t = TERMS.find(x => x.term === name);
  if (!t) return;
  clearSearch();
  activeSec = secOf(t.cat);
  activeCat = t.cat;
  activeSkill = null;
  buildFilters();
  render();
  const card = document.getElementById("t-" + tagBase(name));
  if (!card) return;
  const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  card.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "center" });
  card.classList.add("flash");
  setTimeout(() => card.classList.remove("flash"), 1600);
}

// Jump from a guide chapter to one drill, and highlight it.
function showDrill(name) {
  clearSearch();
  activeSec = "drills";
  activeCat = "All";
  activeSkill = null;
  buildFilters();
  render();
  const card = document.getElementById("d-" + tagBase(name));
  if (!card) return;
  const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  card.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "center" });
  card.classList.add("flash");
  setTimeout(() => card.classList.remove("flash"), 1600);
}

count.addEventListener("click", e => {
  if (e.target.closest(".clear-skill")) setCat("All");
});

grid.addEventListener("click", e => {
  // While the Watch pop-up is open, a tap anywhere else only closes it.
  if (wmBtn && !e.target.closest(".wm, .play")) { closeWatchMenu(); return; }
  if (e.target.closest(".cat, .drills-link, .skill-link")) clearSearch();
  const star = e.target.closest(".fav");
  if (star) {
    const name = star.dataset.term;
    if (favs.has(name)) favs.delete(name); else favs.add(name);
    saveFavs();
    document.getElementById("favn").textContent = favCount();
    if (activeCat === "Favourites") render();
    else {
      const on = favs.has(name);
      star.setAttribute("aria-pressed", on);
      star.setAttribute("aria-label", (on ? "Remove " : "Save ") + name + (on ? " from favourites" : " to favourites"));
    }
    return;
  }
  const dl = e.target.closest(".drills-link");
  if (dl) {
    activeSec = "drills";
    activeCat = "All";
    activeSkill = dl.dataset.skill;
    buildFilters();
    render();
    scrollToControls();
    return;
  }
  const sk = e.target.closest(".skill-link");
  if (sk) {
    // Filter the drill list to everything that trains this skill.
    activeSec = "drills";
    activeCat = "All";
    activeSkill = sk.dataset.skill;
    buildFilters();
    filters.querySelectorAll(".filter").forEach(x => x.setAttribute("aria-pressed", false));
    render();
    scrollToControls();
    return;
  }
  const dj = e.target.closest(".drill-jump");
  if (dj) { showDrill(dj.dataset.drill); return; }
  const lvl = e.target.closest(".lvl");
  if (lvl) { setCat(lvl.dataset.level); scrollToControls(); return; }
  // Tapping a card's category chip filters to that category and jumps back up to the filters.
  const chip = e.target.closest(".cat");
  if (!chip) {
    // Anywhere else on a card (not a link or another button) opens the video player.
    const play = e.target.closest(".play");
    const card = e.target.closest(".term");
    if (play) { openWatchMenu(play); return; }
    if (card && card.dataset.name && !e.target.closest("a, button") && !getSelection().toString()) {
      openPlayer(card.dataset.name, card.dataset.kind);
    }
    return;
  }
  activeCat = chip.dataset.cat;
  activeSec = secOf(activeCat);
  activeSkill = null;
  buildFilters();
  render();
  scrollToControls();
});

// Video player: every item plays the same demo clip for now.
// Later, give each term/drill its own file, e.g. VIDEOS["Euro step"] = "euro-step.mp4".
const DEMO_VIDEO = "intro.mp4";
const VIDEOS = {};
VIDEOS["Transition vs fast break"] = "transition-vs-fast-break.mp4";

function playBtn(name, kind) {

}
// Watch menu: one small pop-up, moved next to whichever Watch button was tapped.
const BALL_ICON = `<svg viewBox="-50 -50 100 100" aria-hidden="true"><circle r="46" fill="#d4581a" stroke="#1d1a17" stroke-width="6"/><path d="M-46 0H46M0-46V46M-32-32Q-13 0-32 32M32-32Q13 0 32 32" fill="none" stroke="#1d1a17" stroke-width="6"/></svg>`;
const watchMenu = document.createElement("div");
watchMenu.className = "wm";
watchMenu.setAttribute("role", "menu");
let wmBtn = null;
function closeWatchMenu() {

  wmBtn.setAttribute("aria-expanded", "false");

  watchMenu.remove();
}
function openWatchMenu(btn) {

  watchMenu.innerHTML = `

  btn.after(watchMenu);

watchMenu.addEventListener("click", e => {

  const btn = wmBtn;
  if (e.target.closest(".wm-hl")) { closeWatchMenu(); openPlayer(btn.dataset.name, btn.dataset.kind); return; }
  if (e.target.closest("a")) setTimeout(closeWatchMenu, 0);
});
document.addEventListener("click", e => {
  if (wmBtn && !e.target.closest(".wm, .play")) closeWatchMenu();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && wmBtn) { const b = wmBtn; closeWatchMenu(); b.focus(); }
});
const player = document.getElementById("player");
const pVideo = document.getElementById("pVideo");
let lastFocus = null;
function openPlayer(name, kind) {
  lastFocus = document.activeElement;
  document.getElementById("pTitle").textContent = name;
  document.getElementById("pKind").textContent = kind || "";
  const src = VIDEOS[name] || DEMO_VIDEO;
  if (pVideo.getAttribute("src") !== src) pVideo.setAttribute("src", src);
  pVideo.currentTime = 0;
  player.showModal();
  pVideo.play().catch(() => {});
}
function closePlayer() { if (player.open) player.close(); }
player.addEventListener("close", () => {
  pVideo.pause();
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
});
document.getElementById("pClose").addEventListener("click", closePlayer);
// Tapping the dark area around the player closes it.
player.addEventListener("click", e => { if (e.target === player) closePlayer(); });

function linkIcons(name) {
  return `<a class="ext ext-yt" href="${ytSearch(name)}" target="_blank" rel="noopener" title="${ytQuery(name)} on YouTube">${YT_ICON}YouTube</a>
        <a class="ext ext-ig" href="${igTag(name)}" target="_blank" rel="noopener" title="#${tagFor(name)} on Instagram">${IG_LINE}Instagram</a>`;
}

// Search: one query across every term and drill, ignoring the section and filters.
let query = "";
const norm = x => x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
function hl(text) {
  const safe = esc(text);
  if (!query) return safe;
  const words = norm(query).split(" ").filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return safe;
  return safe.replace(new RegExp("(" + words.join("|") + ")", "gi"), "<mark>$1</mark>");
}
// Score: name starts with query > name contains every word > text contains every word.
function score(name, rest) {
  const q = norm(query), n = norm(name), words = q.split(" ");
  if (n.startsWith(q)) return 3;
  if (words.every(w => n.includes(w))) return 2;
  const all = n + " " + norm(rest);
  return words.every(w => all.includes(w)) ? 1 : 0;
}

function termCard(t) {
  const nd = drillsFor(t.term).length;
  return `
    <article class="term" id="t-${tagBase(t.term)}" data-name="${esc(t.term)}" data-kind="${esc(t.cat)}">
      <div class="term-head">
        <h2>${hl(t.term)}</h2>
        <div class="head-tools">
          <button type="button" class="cat" data-cat="${esc(t.cat)}" aria-pressed="${t.cat === activeCat}" aria-label="Show all ${esc(t.cat)} terms">${esc(t.cat)}</button>
          <button type="button" class="fav" data-term="${esc(t.term)}" aria-pressed="${favs.has(t.term)}" aria-label="${favs.has(t.term) ? "Remove " + esc(t.term) + " from favourites" : "Save " + esc(t.term) + " to favourites"}">${STAR}</button>
        </div>
      </div>
      <p>${hl(t.def)}</p>
      <div class="links">
        ${playBtn(t.term, t.cat)}
        ${nd ? `<button type="button" class="drills-link" data-skill="${esc(t.term)}">Train this →</button>` : ""}
      </div>
    </article>`;
}

function drillCard(d) {
  return `
    <article class="term drill" id="d-${tagBase(d.name)}" data-name="${esc(d.name)}" data-kind="Drill · ${esc(d.level)}">
      <div class="term-head">
        <h2>${hl(d.name)}</h2>
        <button type="button" class="cat lvl" data-level="${d.level}" aria-pressed="${d.level === activeCat}" aria-label="Show all ${d.level} drills">${d.level}</button>
      </div>

      <div class="trains"><span>Trains</span>${d.skills.map(s => `<button type="button" class="skill-link" data-skill="${esc(s)}" aria-pressed="${s === activeSkill}" aria-label="Show all drills for ${esc(s)}">${hl(s)}</button>`).join("")}</div>
      <ol class="steps">${d.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      <p class="tip"><b>Coaching point:</b> ${esc(d.tip)}</p>
      <div class="links">
        ${playBtn(d.name, "Drill · " + d.level)}
        <a class="book" href="${BOOKING_URL}" target="_blank" rel="noopener">Book a session →</a>
      </div>
    </article>`;
}

function guideCard(g) {
  const teach = g.teach.map(t => {
    const i = t.indexOf(": ");
    return i > 0 && i < 28 ? `<li><b>${esc(t.slice(0, i))}:</b> ${esc(t.slice(i + 2))}</li>` : `<li>${esc(t)}</li>`;
  }).join("");
  const faults = g.faults ? `<details class="gfaults"><summary>Common faults and fixes</summary><div class="gscroll"><table class="gtable"><thead><tr><th>You see</th><th>Usually because</th><th>Fix</th></tr></thead><tbody>${
    g.faults.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>` : "";
  const drills = g.drills.length ? `<div class="trains"><span>Drills</span>${g.drills.map(d => `<button type="button" class="drill-jump" data-drill="${esc(d)}" aria-label="Open the ${esc(d)} drill">${esc(d)}</button>`).join("")}</div>` : "";
  return `
    <article class="term guide" id="g-${tagBase(g.title)}">
      <div class="term-head"><h2><span class="gnum">${String(g.n).padStart(2, "0")}</span>${esc(g.title)}</h2><span class="gtag">${esc(g.group)}</span></div>
      <p class="glede">${esc(g.lede)}</p>
      <div class="gcols">
        <div><h3>Teach it</h3><ul class="gteach">${teach}</ul></div>
        <div><h3>Cues</h3><div class="gcues">${g.cues.map(c => `<span class="gcue">${esc(c)}</span>`).join("")}</div>
          <h3>Coach's eye</h3><p class="geye">${esc(g.eye)}</p></div>
      </div>
      ${g.extra ? `<div class="gextra">${g.extra}</div>` : ""}
      ${faults}
      ${drills}
    </article>`;
}

function renderGuide() {
  const list = GUIDE.filter(g => activeCat === "All" || g.group === activeCat);
  count.textContent = list.length === 1 ? "1 chapter" : list.length + " chapters";
  grid.innerHTML = list.map(guideCard).join("");
}

function renderSearch() {
  const rank = (arr, name, rest) => arr
    .map(x => [x, score(name(x), rest(x))]).filter(([, sc]) => sc)
    .sort((a, b) => b[1] - a[1] || name(a[0]).localeCompare(name(b[0])))
    .map(([x]) => x);
  const terms = rank(TERMS, t => t.term, t => t.def + " " + t.cat);
  const drills = rank(DRILLS, d => d.name, d => d.skills.join(" ") + " " + d.level + " " + d.steps.join(" "));
  const n = terms.length + drills.length;
  count.innerHTML = `${n === 1 ? "1 result" : n + " results"} for <b>${esc(query.trim())}</b> · <button type="button" class="clear-skill">Clear search</button>`;
  grid.innerHTML = n ? terms.map(termCard).join("") + drills.map(drillCard).join("")
    : `<div class="empty">Nothing matches “${esc(query.trim())}”. Try a shorter word, like “cross” or “zone”.</div>`;
}

function renderDrills() {
  const list = DRILLS
    .filter(d => activeSkill ? d.skills.includes(activeSkill) : activeCat === "All" || d.level === activeCat)
    .sort((a, b) => LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level) || a.name.localeCompare(b.name));

  const n = list.length === 1 ? "1 drill" : list.length + " drills";
  if (activeSkill) count.innerHTML = `${n} for <b>${esc(activeSkill)}</b> · <button type="button" class="clear-skill">Show all training</button>`;
  else count.textContent = n;

  grid.innerHTML = list.length ? list.map(drillCard).join("") : `<div class="empty">No drills here yet.</div>`;
}

function render() {
  if (query.trim()) return renderSearch();
  if (activeSec === "drills") return renderDrills();
  if (activeSec === "coach") return renderGuide();
  const list = TERMS
    .filter(t => activeCat === "Favourites" ? favs.has(t.term)
      : activeCat === "All" ? secOf(t.cat) === activeSec
      : t.cat === activeCat)
    .sort((a, b) => a.term.localeCompare(b.term));

  count.textContent = list.length === 1 ? "1 term" : list.length + " terms";
  grid.innerHTML = list.length ? list.map(termCard).join("")
    : `<div class="empty">${activeCat === "Favourites" ? "No favourites yet. Tap the star on any term to save it here. Favourites are kept in this browser only." : "No terms in this category yet."}</div>`;
}

const searchBtn = document.getElementById("searchBtn");
const searchBar = document.getElementById("searchBar");
const qInput = document.getElementById("q");
// Any filter, section or chip tap leaves search mode and goes back to normal browsing.
function clearSearch() { query = ""; qInput.value = ""; hideSuggest(); syncClear(); }
// The x inside the field shows only while there's something typed, and clears the results.
const qClear = document.getElementById("qClear");
function syncClear() { qClear.hidden = !qInput.value; }
qClear.addEventListener("click", () => { clearSearch(); render(); qInput.focus(); });

// Autocomplete: up to 6 term and drill names matching what's typed. Picking one shows it and jumps to its card.
const suggest = document.getElementById("suggest");
let sugItems = [], sugIdx = -1;
function hideSuggest() {
  suggest.hidden = true; suggest.innerHTML = ""; sugItems = []; sugIdx = -1;
  qInput.setAttribute("aria-expanded", "false");
  qInput.removeAttribute("aria-activedescendant");
}
function buildSuggest() {
  const q = query.trim();
  if (!q) return hideSuggest();
  const pick = (arr, name, label, kind) => arr
    .map(x => ({ name: name(x), label: label(x), kind, sc: score(name(x), "") }))
    .filter(o => o.sc);
  sugItems = [...pick(TERMS, t => t.term, t => t.cat, "t"), ...pick(DRILLS, d => d.name, () => "Drill", "d")]
    .sort((a, b) => b.sc - a.sc || a.name.length - b.name.length || a.name.localeCompare(b.name))
    .slice(0, 6);
  if (!sugItems.length || (sugItems.length === 1 && norm(sugItems[0].name) === norm(q))) return hideSuggest();
  sugIdx = -1;
  suggest.innerHTML = sugItems.map((o, i) =>
    `<li role="option" id="sug-${i}" data-i="${i}" aria-selected="false"><span>${hl(o.name)}</span><small>${esc(o.label)}</small></li>`).join("");
  suggest.hidden = false;
  qInput.setAttribute("aria-expanded", "true");
}
function moveSuggest(d) {
  const n = sugItems.length;
  if (!n) return;
  sugIdx = sugIdx < 0 && d < 0 ? n - 1 : (sugIdx + d + n) % n;
  suggest.querySelectorAll("li").forEach((li, i) => li.setAttribute("aria-selected", i === sugIdx));
  qInput.setAttribute("aria-activedescendant", "sug-" + sugIdx);
  document.getElementById("sug-" + sugIdx).scrollIntoView({ block: "nearest" });
}
function pickSuggest(i) {
  const o = sugItems[i];
  if (!o) return;
  qInput.value = query = o.name;
  hideSuggest();
  render();
  qInput.blur();
  syncClear();
  const id = (o.kind === "t" ? "t-" : "d-") + tagBase(o.name);
  // Scroll after the phone keyboard has closed; scrolling while it animates away gets cancelled.
  const go = () => {
    const card = document.getElementById(id);
    if (!card) return;
    const r = card.getBoundingClientRect();
    const top = window.scrollY + r.top - Math.max(16, (window.innerHeight - r.height) / 2);
    const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: Math.max(0, top), behavior: smooth ? "smooth" : "auto" });
    card.classList.add("flash");
    setTimeout(() => card.classList.remove("flash"), 1600);
  };
  requestAnimationFrame(go);
  setTimeout(go, 400);
}
// pointerdown + preventDefault keeps focus in the field so the list doesn't close before the tap lands.
suggest.addEventListener("pointerdown", e => e.preventDefault());
suggest.addEventListener("mousedown", e => e.preventDefault());
// Pick on pointerup: on phones the field can lose focus before a click event arrives, which would close the list first.
suggest.addEventListener("pointerup", e => {
  const li = e.target.closest("li");
  if (li) pickSuggest(+li.dataset.i);
});
function openSearch(open) {
  searchBar.hidden = !open;
  searchBtn.setAttribute("aria-expanded", open);
  searchBtn.setAttribute("aria-label", open ? "Close search" : "Search");
  if (open) qInput.focus();
  else if (query) { clearSearch(); render(); }
}
searchBtn.addEventListener("click", () => openSearch(searchBar.hidden));
qInput.addEventListener("input", () => { query = qInput.value; syncClear(); render(); buildSuggest(); });
qInput.addEventListener("focus", buildSuggest);
qInput.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== qInput) hideSuggest(); }, 250));
qInput.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveSuggest(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSuggest(-1); }
  else if (e.key === "Enter") {
    if (sugIdx >= 0) { e.preventDefault(); pickSuggest(sugIdx); }
    else { hideSuggest(); qInput.blur(); }
  }
  else if (e.key === "Escape") {
    if (!suggest.hidden) hideSuggest();
    else { openSearch(false); searchBtn.focus(); }
  }
});

const toTop = document.getElementById("toTop");
// Floating button: only with more than 10 cards, once the filters have scrolled out of view.
const syncToTop = () => {
  const on = grid.querySelectorAll("article").length > 10 && controls.getBoundingClientRect().bottom < 0;
  toTop.classList.toggle("show", on);
  toTop.inert = !on;
};
addEventListener("scroll", syncToTop, { passive: true });
new MutationObserver(syncToTop).observe(grid, { childList: true });
toTop.addEventListener("click", () => {
  const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" });
});

render();
syncToTop();
</script>


</body></html>
